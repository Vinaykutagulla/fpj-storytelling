<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .og-card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 50%, #1e3a8a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255,255,255,0.3) 2px, transparent 2px),
                radial-gradient(circle at 75% 75%, rgba(255,255,255,0.3) 2px, transparent 2px);
            background-size: 50px 50px;
        }
        
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            z-index: 2;
        }
        
        .main-title {
            font-size: 56px;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            margin-bottom: 25px;
            z-index: 2;
            max-width: 1000px;
        }
        
        .subtitle {
            font-size: 32px;
            text-align: center;
            margin-bottom: 20px;
            color: #fbbf24;
            font-weight: 600;
            z-index: 2;
        }
        
        .stats {
            display: flex;
            gap: 60px;
            margin-top: 30px;
            z-index: 2;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-number {
            font-size: 42px;
            font-weight: bold;
            color: #10b981;
        }
        
        .stat-label {
            font-size: 18px;
            margin-top: 5px;
        }
        
        .badge {
            position: absolute;
            top: 40px;
            right: 50px;
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid #10b981;
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #10b981;
        }
        
        .molecule {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 80px;
            height: 80px;
            border: 3px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
    <div class="og-card">
        <div class="bg-pattern"></div>
        
        <div class="molecule">
            C₁₆H₁₈N₂O₄S
        </div>
        
        <div class="badge">
            ISO 9001:2015 Certified
        </div>
        
        <div class="logo">FirstPharmaJob</div>
        
        <div class="main-title">
            Clinical Research Training<br>
            with Job Guarantee
        </div>
        
        <div class="subtitle">
            🎯 95% Placement Success Rate
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-number">1000+</div>
                <div class="stat-label">Students Placed</div>
            </div>
            <div class="stat">
                <div class="stat-number">12</div>
                <div class="stat-label">Weeks Training</div>
            </div>
            <div class="stat">
                <div class="stat-number">50+</div>
                <div class="stat-label">Partner Companies</div>
            </div>
        </div>
    </div>
</body>
</html>
